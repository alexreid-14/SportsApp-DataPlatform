version: 2

models:
  - name: games
    description: "NBA games with home and away team information"
    config:
      materialized: table
      post_hook:
        - "alter table {{ this }} add primary key (game_id)"
    columns:
      - name: game_id
        description: "Unique identifier for each game"
        tests:
          - unique
          - not_null
      - name: game_date
        description: "Date when the game was played"
      - name: game_type
        description: "Type of game (regular season, playoff, etc.)"
      - name: matchup
        description: "Game matchup description"
      - name: season
        description: "NBA season"
      - name: home_team_id
        description: "ID of the home team"
      - name: away_team_id
        description: "ID of the away team"
      - name: home_team_score
        description: "Points scored by the home team"
      - name: away_team_score
        description: "Points scored by the away team"
      - name: home_team_win
        description: "Boolean indicating if the home team won"

  - name: player_teams
    description: "Player team history showing how long each player played for each team"
    config:
      materialized: table
      post_hook:
        - "create index if not exists idx_player_teams_player_id on {{ this }} (player_id)"
        - "create index if not exists idx_player_teams_team_id on {{ this }} (team_id)"
    columns:
      - name: player_id
        description: "Unique identifier for the player"
        tests:
          - not_null
      - name: player_name
        description: "Player's full name"
        tests:
          - not_null
      - name: team_id
        description: "ID of the team"
        tests:
          - not_null
      - name: team_name
        description: "Full name of the team"
      - name: team_abbreviation
        description: "Team abbreviation (e.g., LAL)"
      - name: first_game_date
        description: "Date of first game played for this team"
        tests:
          - not_null
      - name: last_game_date
        description: "Date of last game played for this team"
        tests:
          - not_null
      - name: duration_days
        description: "Number of days between first and last game"
      - name: duration_years
        description: "Approximate number of years played for this team"
      - name: total_games
        description: "Total number of games (including DNPs) for this team"
        tests:
          - not_null
      - name: games_played
        description: "Number of games where player actually played"
        tests:
          - not_null
      - name: games_dnp
        description: "Number of games where player didn't play (DNP/DND)"
      - name: first_season
        description: "First season played for this team"
      - name: last_season
        description: "Last season played for this team"
      - name: first_season_year
        description: "First season year as integer (e.g., 2020)"
      - name: last_season_year
        description: "Last season year as integer (e.g., 2023)"
      - name: season_range
        description: "Season range as a string (e.g., '2020-21 - 2023-24')"
      - name: seasons_played
        description: "Number of seasons played for this team"
      - name: is_current_team
        description: "Boolean indicating if this is the player's current team"

  - name: team_defensive_shot_metrics
    description: "Team defensive performance metrics by shot location with rolling averages"
    config:
      materialized: table
      post_hook:
        - "create index if not exists idx_team_defensive_shot_metrics_team_id on {{ this }} (team_id)"
        - "create index if not exists idx_team_defensive_shot_metrics_season on {{ this }} (season)"
        - "create index if not exists idx_team_defensive_shot_metrics_game_date on {{ this }} (game_date)"
    columns:
      - name: team_id
        description: "ID of the defensive team"
        tests:
          - not_null
      - name: season
        description: "NBA season"
        tests:
          - not_null
      - name: game_date
        description: "Date of the game"
        tests:
          - not_null
      - name: shot_zone_basic
        description: "Basic shot zone (Restricted Area, In The Paint, etc.)"
      - name: shot_zone_area
        description: "Shot zone area (Center, Left Side, Right Side, etc.)"
      - name: shot_zone_range
        description: "Shot zone range (Less Than 8 ft, 8-16 ft, etc.)"
      - name: shots_attempted
        description: "Number of shots attempted against this team"
      - name: shots_made
        description: "Number of shots made against this team"
      - name: defensive_fg_pct
        description: "Field goal percentage allowed by this team"
      - name: defensive_efficiency
        description: "Defensive efficiency (1 - FG%)"
      - name: rolling_defensive_fg_pct_10g
        description: "10-game rolling average defensive field goal percentage"
      - name: rolling_defensive_efficiency_10g
        description: "10-game rolling average defensive efficiency"
      - name: rolling_defensive_fg_pct_20g
        description: "20-game rolling average defensive field goal percentage"
      - name: rolling_defensive_efficiency_20g
        description: "20-game rolling average defensive efficiency"
      - name: season_defensive_fg_pct
        description: "Season-to-date defensive field goal percentage"
      - name: season_defensive_efficiency
        description: "Season-to-date defensive efficiency"

  - name: team_defensive_box_metrics
    description: "Team defensive metrics from box scores with rolling averages"
    config:
      materialized: table
      post_hook:
        - "create index if not exists idx_team_defensive_box_metrics_team_id on {{ this }} (team_id)"
        - "create index if not exists idx_team_defensive_box_metrics_season on {{ this }} (season)"
        - "create index if not exists idx_team_defensive_box_metrics_game_date on {{ this }} (game_date)"
    columns:
      - name: team_id
        description: "ID of the defensive team"
        tests:
          - not_null
      - name: season
        description: "NBA season"
        tests:
          - not_null
      - name: game_date
        description: "Date of the game"
        tests:
          - not_null
      - name: steals
        description: "Steals by the team in this game"
      - name: blocks
        description: "Blocks by the team in this game"
      - name: defensive_rebounds
        description: "Defensive rebounds by the team in this game"
      - name: points_allowed
        description: "Points allowed by the team in this game"
      - name: def_rating
        description: "Defensive rating for this game"
      - name: rolling_steals_10g
        description: "10-game rolling average steals"
      - name: rolling_blocks_10g
        description: "10-game rolling average blocks"
      - name: rolling_defensive_rebounds_10g
        description: "10-game rolling average defensive rebounds"
      - name: rolling_points_allowed_10g
        description: "10-game rolling average points allowed"
      - name: rolling_def_rating_10g
        description: "10-game rolling average defensive rating"
      - name: rolling_steals_20g
        description: "20-game rolling average steals"
      - name: rolling_blocks_20g
        description: "20-game rolling average blocks"
      - name: rolling_defensive_rebounds_20g
        description: "20-game rolling average defensive rebounds"
      - name: rolling_points_allowed_20g
        description: "20-game rolling average points allowed"
      - name: rolling_def_rating_20g
        description: "20-game rolling average defensive rating"
      - name: season_steals
        description: "Season-to-date average steals"
      - name: season_blocks
        description: "Season-to-date average blocks"
      - name: season_defensive_rebounds
        description: "Season-to-date average defensive rebounds"
      - name: season_points_allowed
        description: "Season-to-date average points allowed"
      - name: season_def_rating
        description: "Season-to-date average defensive rating"

  - name: player_game_defensive_features
    description: "Comprehensive defensive features for ML models at player-game level"
    config:
      materialized: table
      post_hook:
        - "create index if not exists idx_player_game_defensive_features_player_id on {{ this }} (player_id)"
        - "create index if not exists idx_player_game_defensive_features_game_id on {{ this }} (game_id)"
        - "create index if not exists idx_player_game_defensive_features_opponent_team_id on {{ this }} (opponent_team_id)"
    columns:
      - name: game_id
        description: "Unique identifier for the game"
        tests:
          - not_null
      - name: player_id
        description: "Unique identifier for the player"
        tests:
          - not_null
      - name: player_team_id
        description: "ID of the player's team"
        tests:
          - not_null
      - name: opponent_team_id
        description: "ID of the opponent team"
        tests:
          - not_null
      - name: game_date
        description: "Date of the game"
        tests:
          - not_null
      - name: season
        description: "NBA season"
        tests:
          - not_null
      - name: points
        description: "Points scored by the player"
      - name: rebounds
        description: "Rebounds by the player"
      - name: assists
        description: "Assists by the player"
      - name: steals
        description: "Steals by the player"
      - name: blocks
        description: "Blocks by the player"
      - name: minutes_played
        description: "Minutes played by the player"
      - name: opp_def_fg_pct_10g
        description: "Opponent 10-game rolling defensive field goal percentage"
      - name: opp_def_efficiency_10g
        description: "Opponent 10-game rolling defensive efficiency"
      - name: opp_def_restricted_area_10g
        description: "Opponent 10-game rolling defensive FG% in restricted area"
      - name: opp_def_paint_10g
        description: "Opponent 10-game rolling defensive FG% in paint"
      - name: opp_def_mid_range_10g
        description: "Opponent 10-game rolling defensive FG% in mid-range"
      - name: opp_def_above_break_3_10g
        description: "Opponent 10-game rolling defensive FG% on above break 3s"
      - name: opp_def_corner_3_10g
        description: "Opponent 10-game rolling defensive FG% on corner 3s"
      - name: opp_def_fg_pct_20g
        description: "Opponent 20-game rolling defensive field goal percentage"
      - name: opp_def_efficiency_20g
        description: "Opponent 20-game rolling defensive efficiency"
      - name: opp_def_restricted_area_20g
        description: "Opponent 20-game rolling defensive FG% in restricted area"
      - name: opp_def_paint_20g
        description: "Opponent 20-game rolling defensive FG% in paint"
      - name: opp_def_mid_range_20g
        description: "Opponent 20-game rolling defensive FG% in mid-range"
      - name: opp_def_above_break_3_20g
        description: "Opponent 20-game rolling defensive FG% on above break 3s"
      - name: opp_def_corner_3_20g
        description: "Opponent 20-game rolling defensive FG% on corner 3s"
      - name: opp_def_fg_pct_season
        description: "Opponent season-to-date defensive field goal percentage"
      - name: opp_def_efficiency_season
        description: "Opponent season-to-date defensive efficiency"
      - name: opp_def_restricted_area_season
        description: "Opponent season-to-date defensive FG% in restricted area"
      - name: opp_def_paint_season
        description: "Opponent season-to-date defensive FG% in paint"
      - name: opp_def_mid_range_season
        description: "Opponent season-to-date defensive FG% in mid-range"
      - name: opp_def_above_break_3_season
        description: "Opponent season-to-date defensive FG% on above break 3s"
      - name: opp_def_corner_3_season
        description: "Opponent season-to-date defensive FG% on corner 3s"
      - name: opp_steals_10g
        description: "Opponent 10-game rolling average steals"
      - name: opp_blocks_10g
        description: "Opponent 10-game rolling average blocks"
      - name: opp_defensive_rebounds_10g
        description: "Opponent 10-game rolling average defensive rebounds"
      - name: opp_points_allowed_10g
        description: "Opponent 10-game rolling average points allowed"
      - name: opp_def_rating_10g
        description: "Opponent 10-game rolling average defensive rating"
      - name: opp_steals_20g
        description: "Opponent 20-game rolling average steals"
      - name: opp_blocks_20g
        description: "Opponent 20-game rolling average blocks"
      - name: opp_defensive_rebounds_20g
        description: "Opponent 20-game rolling average defensive rebounds"
      - name: opp_points_allowed_20g
        description: "Opponent 20-game rolling average points allowed"
      - name: opp_def_rating_20g
        description: "Opponent 20-game rolling average defensive rating"
      - name: opp_steals_season
        description: "Opponent season-to-date average steals"
      - name: opp_blocks_season
        description: "Opponent season-to-date average blocks"
      - name: opp_defensive_rebounds_season
        description: "Opponent season-to-date average defensive rebounds"
      - name: opp_points_allowed_season
        description: "Opponent season-to-date average points allowed"
      - name: opp_def_rating_season
        description: "Opponent season-to-date average defensive rating"
